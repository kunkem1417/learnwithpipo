<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipoedu – Chơi game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #171433;
    --haze: #25214a;
    --line: #38336a;
    --ink: #f3efe6;
    --mist: #aaa5cc;
    --moon: #d9483b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    line-height: 1.55;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .moon {
    position: absolute; top: -140px; right: -120px;
    width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e8665a, var(--moon) 55%, #8f2a25);
    opacity: .85; pointer-events: none;
  }
  header, main { position: relative; max-width: 920px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 64px; padding-bottom: 36px; }
  h1 { font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; }
  header p { margin: 0; color: var(--mist); max-width: 46ch; }
  main { padding-bottom: 80px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .game {
    background: var(--haze); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .game h2 { margin: 0; font-size: 1.2rem; font-weight: 600; }
  .game p { margin: 0; color: var(--mist); font-size: .95rem; flex: 1; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    padding: 10px 16px; font-weight: 600; background: var(--moon); color: #fff;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .msg { color: var(--mist); padding: 30px 0; }
  .msg.err { color: #ff9d94; }

  #player { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
  #player.open { display: flex; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--night); border-bottom: 1px solid var(--line); }
  #bar strong { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar button { padding: 7px 12px; }
  #frame { flex: 1; width: 100%; border: 0; background: #000; }
  #loading { position: absolute; inset: 48px 0 0 0; display: grid; place-items: center; color: var(--mist); pointer-events: none; }
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div>

<header>
  <h1>Pipoedu</h1>
  <p>Chọn một game và chơi ngay trên trình duyệt, không cần tải về.</p>
</header>

<main>
  <div id="list" class="grid"></div>
  <div id="status" class="msg">Đang tải danh sách game…</div>
</main>

<div id="player" role="dialog" aria-label="Màn hình chơi game">
  <div id="bar">
    <strong id="ptitle"></strong>
    <button class="ghost" id="fs">Toàn màn hình</button>
    <button id="close">Đóng</button>
  </div>
  <div id="loading">Đang tải game…</div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; cross-origin-isolated"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ====== ĐIỀN THÔNG TIN SUPABASE CỦA BẠN ======
  const SUPABASE_URL = 'https://hkghhkevvggphqhyzypg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_A8P5HhnUQb0f9GYJaWpw5Q_XRkgG3hl';   // dùng anon/public key, KHÔNG dùng service_role
  // ============================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  let games = [];

  async function load() {
    const { data, error } = await sb.from('games')
      .select('id,title,description,slug,created_at')
      .order('created_at', { ascending: false });
    if (error) {
      $('status').textContent = 'Không tải được danh sách game: ' + error.message;
      $('status').className = 'msg err';
      return;
    }
    games = data;
    $('status').textContent = games.length ? '' : 'Chưa có game nào.';
    const list = $('list');
    list.innerHTML = '';
    for (const g of games) {
      const el = document.createElement('div');
      el.className = 'game';
      const h = document.createElement('h2'); h.textContent = g.title;
      const p = document.createElement('p'); p.textContent = g.description || '';
      const b = document.createElement('button'); b.textContent = 'Chơi ngay';
      b.onclick = () => play(g);
      el.append(h, p, b);
      list.appendChild(el);
    }
    const slug = decodeURIComponent(location.hash.slice(1));
    const g = games.find(x => x.slug === slug);
    if (g) play(g);
  }

  async function play(g) {
    $('ptitle').textContent = g.title;
    $('player').classList.add('open');
    $('loading').style.display = 'grid';
    $('loading').textContent = 'Đang tải game…';
    document.body.style.overflow = 'hidden';
    history.replaceState(null, '', '#' + encodeURIComponent(g.slug));
    try {
      const base = `${SUPABASE_URL}/storage/v1/object/public/games/${g.slug}/`;
      const res = await fetch(base + 'index.html');
      if (!res.ok) throw new Error('Không tìm thấy file index.html của game');
      let html = await res.text();
      const tag = `<base href="${base}">`;
      html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + tag) : tag + html;
      const f = $('frame');
      f.onload = () => { $('loading').style.display = 'none'; f.focus(); };
      f.srcdoc = html;
    } catch (e) {
      $('loading').textContent = 'Lỗi: ' + e.message;
    }
  }

  function closeGame() {
    $('frame').srcdoc = '';
    $('player').classList.remove('open');
    document.body.style.overflow = '';
    history.replaceState(null, '', location.pathname);
  }

  $('close').onclick = closeGame;
  $('fs').onclick = () => { const f = $('frame'); (f.requestFullscreen || f.webkitRequestFullscreen).call(f); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.fullscreenElement) closeGame(); });

  load();
</script>
</body>
</html>
